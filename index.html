    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
    <style>
/* src/styles/global.css */
:root {
  --bg: #0b0f14;
  --bg-2: #0f151c;
  --surface: #141b23;
  --surface-2: #1a222c;
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef2f6;
  --muted: #9aa7b5;
  --gold: #d9a441;
  --gold-2: #f0cd8a;
  --gold-grad:
    linear-gradient(
      135deg,
      #e6b45c 0%,
      #d9a441 45%,
      #b8862f 100%);
  --danger: #ef6a6a;
  --success: #52c98b;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font-display:
    "Playfair Display",
    Georgia,
    serif;
  --font-body:
    "Inter",
    system-ui,
    -apple-system,
    sans-serif;
  --nav-h: 74px;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.no-scroll {
  overflow: hidden;
}
img {
  max-width: 100%;
  display: block;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font-family: inherit;
  cursor: pointer;
}
input,
select,
textarea {
  font-family: inherit;
  font-size: 1rem;
}
h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  line-height: 1.15;
  margin: 0 0 .5em;
  font-weight: 700;
  letter-spacing: .01em;
}
p {
  margin: 0 0 1em;
}
::selection {
  background: var(--gold);
  color: #14100a;
}
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: var(--bg-2);
}
::-webkit-scrollbar-thumb {
  background: #2a3441;
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold);
}
.app-main {
  min-height: 60vh;
}
.container {
  width: min(1200px, 92%);
  margin-inline: auto;
}
.muted {
  color: var(--muted);
}
.gold {
  color: var(--gold-2);
}
.center {
  text-align: center;
}
.mt-0 {
  margin-top: 0;
}
.mb-0 {
  margin-bottom: 0;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: .78rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--gold-2);
  font-weight: 600;
  margin-bottom: 16px;
}
.eyebrow::before {
  content: "";
  width: 34px;
  height: 1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold));
}
.eyebrow.centered::after {
  content: "";
  width: 34px;
  height: 1px;
  background:
    linear-gradient(
      270deg,
      transparent,
      var(--gold));
}
.section {
  padding: 96px 0;
  position: relative;
}
.section--tight {
  padding: 64px 0;
}
.section--alt {
  background:
    linear-gradient(
      180deg,
      var(--bg-2),
      var(--bg));
}
.section__head {
  max-width: 720px;
  margin-bottom: 52px;
}
.section__head.centered {
  margin-inline: auto;
  text-align: center;
}
.section__title {
  font-size: clamp(2rem, 4vw, 3rem);
  margin-bottom: 14px;
}
.section__sub {
  color: var(--muted);
  font-size: 1.05rem;
  margin: 0;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: .95rem;
  letter-spacing: .02em;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    border-color .25s ease,
    color .25s ease;
  white-space: nowrap;
}
.btn:active {
  transform: translateY(1px) scale(.99);
}
.btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}
.btn--primary {
  background: var(--gold-grad);
  color: #1a1206;
  box-shadow: 0 12px 30px rgba(217, 164, 65, 0.28);
}
.btn--primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(217, 164, 65, 0.38);
}
.btn--ghost {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--line);
  color: var(--text);
}
.btn--ghost:hover {
  border-color: var(--gold);
  color: var(--gold-2);
  transform: translateY(-2px);
}
.btn--outline-gold {
  background: transparent;
  border-color: rgba(217, 164, 65, .55);
  color: var(--gold-2);
}
.btn--outline-gold:hover {
  background: rgba(217, 164, 65, .12);
  transform: translateY(-2px);
}
.btn--sm {
  padding: 10px 18px;
  font-size: .87rem;
}
.btn--block {
  width: 100%;
}
.btn--icon {
  padding: 11px;
  border-radius: 50%;
}
.navbar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 60;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  transition:
    background .3s ease,
    box-shadow .3s ease,
    height .3s ease;
  background: transparent;
}
.navbar.is-scrolled {
  background: rgba(11, 15, 20, 0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid var(--line);
}
.navbar__inner {
  width: min(1240px, 94%);
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.navbar__brand {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 900;
  letter-spacing: .12em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.navbar__brand span {
  color: var(--gold-2);
}
.navbar__mark {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--gold-grad);
  color: #1a1206;
  display: grid;
  place-items: center;
  font-size: 1rem;
  font-weight: 900;
}
.navbar__links {
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav-link {
  position: relative;
  padding: 9px 15px;
  border-radius: 999px;
  font-size: .93rem;
  font-weight: 500;
  color: #cdd6e0;
  transition: color .2s ease, background .2s ease;
}
.nav-link:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}
.nav-link.is-active {
  color: #1a1206;
  background: var(--gold-grad);
  font-weight: 600;
}
.navbar__actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.cart-btn {
  position: relative;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  color: var(--text);
}
.cart-btn:hover {
  border-color: var(--gold);
  color: var(--gold-2);
}
.cart-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--gold-grad);
  color: #1a1206;
  font-size: .72rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  animation: pop .3s ease;
}
.burger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: 0;
  padding: 8px;
}
.burger span {
  width: 24px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: .3s;
  display: block;
}
.burger.is-open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.burger.is-open span:nth-child(2) {
  opacity: 0;
}
.burger.is-open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}
.mobile-menu {
  position: fixed;
  inset: var(--nav-h) 0 auto;
  background: rgba(11, 15, 20, 0.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 18px 4% 26px;
  display: none;
  flex-direction: column;
  gap: 6px;
  z-index: 59;
  animation: slideDown .28s ease;
}
.mobile-menu .nav-link {
  padding: 13px 16px;
  font-size: 1.02rem;
}
.mobile-menu .btn {
  margin-top: 12px;
}
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  overflow: hidden;
  padding-top: var(--nav-h);
}
.hero__bg {
  position: absolute;
  inset: 0;
  z-index: -2;
}
.hero__bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: kenburns 22s ease-in-out infinite alternate;
}
.hero__bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(11, 15, 20, .78) 0%,
      rgba(11, 15, 20, .62) 45%,
      rgba(11, 15, 20, .96) 100%),
    radial-gradient(
      60% 60% at 70% 30%,
      rgba(217, 164, 65, .14),
      transparent 70%);
}
.hero__content {
  width: min(1200px, 92%);
  margin-inline: auto;
  padding: 60px 0 90px;
}
.hero__title {
  font-size: clamp(2.6rem, 6.4vw, 5.2rem);
  font-weight: 900;
  line-height: 1.04;
  margin-bottom: 22px;
  max-width: 15ch;
}
.hero__title em {
  font-style: italic;
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero__text {
  color: #c6cfda;
  font-size: clamp(1rem, 1.6vw, 1.18rem);
  max-width: 56ch;
  margin-bottom: 34px;
}
.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 46px;
}
.hero__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
}
.hero__meta-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #b9c3ce;
  font-size: .92rem;
}
.hero__meta-item svg {
  color: var(--gold-2);
  flex-shrink: 0;
}
.hero__badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 16px;
  border: 1px solid rgba(217, 164, 65, .4);
  background: rgba(217, 164, 65, .1);
  color: var(--gold-2);
  border-radius: 999px;
  font-size: .8rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 26px;
}
.hero__badge .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 1.6s infinite;
}
.scroll-cue {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  color: var(--muted);
  font-size: .72rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.scroll-cue::after {
  content: "";
  width: 1px;
  height: 44px;
  background:
    linear-gradient(
      180deg,
      var(--gold),
      transparent);
  animation: cue 1.8s ease-in-out infinite;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-top: -60px;
  position: relative;
  z-index: 5;
}
.stat {
  background:
    linear-gradient(
      160deg,
      var(--surface-2),
      var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 22px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat__num {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 3vw, 2.5rem);
  font-weight: 900;
  color: var(--gold-2);
}
.stat__label {
  color: var(--muted);
  font-size: .88rem;
}
.dish-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 26px;
}
.dish-card {
  background:
    linear-gradient(
      170deg,
      var(--surface-2),
      var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition:
    transform .35s ease,
    border-color .35s ease,
    box-shadow .35s ease;
}
.dish-card:hover {
  transform: translateY(-8px);
  border-color: rgba(217, 164, 65, .45);
  box-shadow: var(--shadow);
}
.dish-card__media {
  position: relative;
  aspect-ratio: 16 / 11;
  overflow: hidden;
  background: #10161d;
}
.dish-card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .6s ease;
}
.dish-card:hover .dish-card__media img {
  transform: scale(1.07);
}
.dish-card__body {
  padding: 20px 22px 22px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.dish-card__title {
  font-size: 1.25rem;
  margin-bottom: 7px;
}
.dish-card__desc {
  color: var(--muted);
  font-size: .9rem;
  margin-bottom: 16px;
  flex: 1;
}
.dish-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.dish-card__price {
  font-weight: 700;
  color: var(--gold-2);
  font-size: 1.05rem;
  white-space: nowrap;
}
.tag {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(11, 15, 20, .82);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(217, 164, 65, .5);
  color: var(--gold-2);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 999px;
}
.qty {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
}
.qty__btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--text);
  display: grid;
  place-items: center;
  transition: background .2s;
}
.qty__btn:hover {
  background: rgba(217, 164, 65, .18);
  color: var(--gold-2);
}
.qty__val {
  min-width: 26px;
  text-align: center;
  font-weight: 600;
  font-size: .92rem;
}
.split {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 60px;
  align-items: center;
}
.split--reverse .split__media {
  order: 2;
}
.split__media {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.split__media img {
  width: 100%;
  aspect-ratio: 4 / 3.4;
  object-fit: cover;
}
.split__float {
  position: absolute;
  right: -14px;
  bottom: 26px;
  background: var(--gold-grad);
  color: #1a1206;
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  font-weight: 700;
  line-height: 1.3;
  max-width: 210px;
}
.split__float small {
  display: block;
  font-weight: 500;
  font-size: .78rem;
  opacity: .8;
}
.split__body h2 {
  font-size: clamp(1.9rem, 3.4vw, 2.7rem);
}
.split__body p {
  color: var(--muted);
}
.check-list {
  list-style: none;
  padding: 0;
  margin: 22px 0 28px;
  display: grid;
  gap: 12px;
}
.check-list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  color: #cdd6e0;
}
.check-list li svg {
  color: var(--gold-2);
  flex-shrink: 0;
  margin-top: 4px;
}
.band {
  border-radius: calc(var(--radius) + 6px);
  border: 1px solid rgba(217, 164, 65, .35);
  background:
    radial-gradient(
      70% 130% at 15% 0%,
      rgba(217, 164, 65, .16),
      transparent 60%),
    linear-gradient(
      160deg,
      var(--surface-2),
      var(--surface));
  padding: clamp(30px, 5vw, 54px);
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  align-items: center;
}
.band--plain {
  border-color: var(--line);
}
.steps {
  display: grid;
  gap: 16px;
}
.step {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  background: rgba(255, 255, 255, .03);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
}
.step__num {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--gold-grad);
  color: #1a1206;
  font-weight: 800;
  display: grid;
  place-items: center;
}
.step h4 {
  margin: 0 0 4px;
  font-size: 1.05rem;
  font-family: var(--font-body);
}
.step p {
  margin: 0;
  color: var(--muted);
  font-size: .9rem;
}
.testimonials {
  position: relative;
}
.quote-card {
  background:
    linear-gradient(
      170deg,
      var(--surface-2),
      var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(26px, 4vw, 46px);
  max-width: 820px;
  margin-inline: auto;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.quote-card__stars {
  color: var(--gold);
  display: inline-flex;
  gap: 4px;
  margin-bottom: 18px;
}
.quote-card__text {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2.4vw, 1.6rem);
  font-style: italic;
  line-height: 1.5;
  margin-bottom: 22px;
}
.quote-card__who {
  color: var(--muted);
  font-size: .92rem;
}
.quote-card__who strong {
  color: var(--text);
  display: block;
  font-size: 1rem;
}
.slider-dots {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin-top: 26px;
}
.slider-dots button {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 0;
  background: #38424f;
  transition: .25s;
  padding: 0;
}
.slider-dots button.is-active {
  background: var(--gold);
  width: 26px;
  border-radius: 999px;
}
.page-head {
  position: relative;
  padding: calc(var(--nav-h) + 84px) 0 74px;
  background:
    linear-gradient(
      180deg,
      rgba(11, 15, 20, .62),
      rgba(11, 15, 20, .95)),
    radial-gradient(
      70% 120% at 80% 0%,
      rgba(217, 164, 65, .18),
      transparent 65%),
    var(--bg-2);
  border-bottom: 1px solid var(--line);
  text-align: center;
  overflow: hidden;
}
.page-head::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image:
    linear-gradient(
      180deg,
      transparent,
      #000 40%,
      transparent);
  opacity: .5;
}
.page-head h1 {
  font-size: clamp(2.3rem, 5vw, 3.6rem);
  margin-bottom: 12px;
  position: relative;
}
.page-head p {
  color: var(--muted);
  max-width: 62ch;
  margin: 0 auto;
  position: relative;
}
.breadcrumb {
  display: inline-flex;
  gap: 8px;
  font-size: .85rem;
  color: var(--muted);
  margin-bottom: 18px;
  position: relative;
}
.breadcrumb a:hover {
  color: var(--gold-2);
}
.breadcrumb span {

  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
}
.chef-row strong {
  display: block;
}
.chef-row small {
  color: var(--muted);
}
.reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.is-visible {
  opacity: 1;
  transform: none;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes slideLeft {
  from {
    transform: translateX(100%);
  }
  to {
    transform: none;
  }
}
@keyframes pop {
  0% {
    transform: scale(.4);
  }
  70% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(82, 201, 139, .6);
  }
  70% {
    box-shadow: 0 0 0 8px rgba(82, 201, 139, 0);
  }
}
@keyframes cue {
  0%, 100% {
    transform: scaleY(.4);
    opacity: .5;
  }
  50% {
    transform: scaleY(1);
    opacity: 1;
  }
}
@keyframes kenburns {
  from {
    transform: scale(1) translate(0, 0);
  }
  to {
    transform: scale(1.12) translate(-1.5%, -1%);
  }
}
@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(22px) scale(.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  html {
    scroll-behavior: auto;
  }
}
@media (max-width: 1024px) {
  .footer__grid {
    grid-template-columns: 1fr 1fr;
  }
  .band {
    grid-template-columns: 1fr;
  }
  .contact-split {
    grid-template-columns: 1fr;
  }
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 900px) {
  .navbar__links,
  .navbar__actions .btn {
    display: none;
  }
  .burger {
    display: flex;
  }
  .mobile-menu {
    display: flex;
  }
  .split,
  .split--reverse {
    grid-template-columns: 1fr;
    gap: 34px;
  }
  .split--reverse .split__media {
    order: 0;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
    margin-top: -40px;
  }
  .section {
    padding: 70px 0;
  }
}
@media (max-width: 640px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  .gallery-grid {
    grid-template-columns: 1fr;
  }
  .footer__grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }
  .hero__meta {
    gap: 16px;
    flex-direction: column;
  }
  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  .search-box {
    max-width: none;
  }
  .lightbox__nav--prev {
    left: 8px;
  }
  .lightbox__nav--next {
    right: 8px;
  }
  .btn {
    width: auto;
  }
  .hero__actions .btn {
    flex: 1;
  }
}
